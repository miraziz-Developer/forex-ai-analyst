services:
  - type: web
    name: forex-ai-analyst
    runtime: python
    buildCommand: pip install .
    startCommand: python app.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # Public HTTPS service URL, for example https://forex-ai-analyst.onrender.com.
      # Enables automatic Telegram command and inline-button webhook setup.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: AUTO_EXECUTE_TRADES
        # BingX VST/demo orders require this plus BINGX_API_KEY and BINGX_SECRET.
        # Configure explicitly in Render: "true" enables virtual-money orders;
        # leaving it empty/false keeps fail-closed behavior.
        sync: false
      - key: KILL_SWITCH
        value: "false"
      # Rule-based Donchian 4h long strategy (docs/LAB_REPORT.md); no AI provider is used.
      - key: DONCHIAN_ENTRY_N
        value: "100"
      - key: DONCHIAN_EXIT_N
        value: "20"
      - key: DONCHIAN_STOP_ATR
        value: "3.0"
      - key: DONCHIAN_LEVERAGE
        value: "3"
      # Second engine: crypto capitulation rebound on 1h (docs/CRYPTO_ENGINE2_STUDY.md), stop and target on BingX,
      # closed after 24 hours. Shares the pair list, the risk controls and the one-position-per-pair gate.
      - key: REBOUND_ENABLED
        value: "true"
      - key: REBOUND_LEVERAGE
        value: "3"
      # 32 more coins for the rebound engine only (passed on unseen data); at most 5 rebound positions at once
      - key: REBOUND_EXTRA_PAIRS
        value: "XTZ-USDT,THETA-USDT,VET-USDT,ICP-USDT,MANA-USDT,GALA-USDT,CHZ-USDT,ENJ-USDT,KSM-USDT,COMP-USDT,SNX-USDT,1INCH-USDT,SUSHI-USDT,ZIL-USDT,IOTA-USDT,NEO-USDT,QTUM-USDT,ONT-USDT,BAT-USDT,ZRX-USDT,KAVA-USDT,RUNE-USDT,EGLD-USDT,HBAR-USDT,GRT-USDT,CELO-USDT,SKL-USDT,ANKR-USDT,CTSI-USDT,DYDX-USDT,ENS-USDT,APE-USDT"
      - key: REBOUND_MAX_OPEN
        value: "5"
      - key: MAX_CONCURRENT_POSITIONS
        value: "12"
      - key: TRADE_COOLDOWN_MINUTES
        value: "60"
      - key: BINGX_API_KEY
        sync: false
      - key: BINGX_SECRET
        sync: false
      # Public BingX perpetual OHLCV only. No BingX account or API key is needed.
      # This is the one multi-strategy Render service; VST execution remains optional.
      - key: MULTI_STRATEGY_PROVIDER
        value: "bingx"
      - key: MULTI_STRATEGY_PAIRS
        value: "BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,BNB-USDT,DOGE-USDT,ADA-USDT,LINK-USDT,AVAX-USDT,LTC-USDT,DOT-USDT,TRX-USDT,BCH-USDT,UNI-USDT,NEAR-USDT,ATOM-USDT,ETC-USDT,FIL-USDT,AAVE-USDT,XLM-USDT,ZEC-USDT,RLC-USDT,YFI-USDT,DASH-USDT,SAND-USDT,XMR-USDT,TRB-USDT,AXS-USDT,CRV-USDT,ALGO-USDT"
      - key: MULTI_STRATEGY_SCAN_INTERVAL_SECONDS
        value: "300"
      - key: VST_OPEN_SLA_MINUTES
        value: "120"
services:
  - type: web
    name: forex-ai-analyst
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: AUTO_EXECUTE_TRADES
        value: "false"
      # Public Binance Futures OHLCV only. No Binance account or API key is needed.
      # This is the one, paper-only multi-strategy Render service.
      - key: MULTI_STRATEGY_PROVIDER
        value: "binance_futures"
      - key: MULTI_STRATEGY_PAIRS
        value: "BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,BNB-USDT"
      - key: MULTI_STRATEGY_SCAN_INTERVAL_SECONDS
        value: "300"
      - key: RISK_USDT_PER_TRADE
        value: "0.75"
      - key: MAX_DAILY_LOSS_USDT
        value: "2.00"
      - key: MAX_DAILY_TRADES
        value: "3"
      - key: MAX_OPEN_POSITIONS
        value: "1"
      - key: MIN_REWARD_RISK
        value: "1.3"
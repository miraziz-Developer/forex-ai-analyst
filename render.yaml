services:
  - type: web
    name: forex-ai-analyst
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # Public HTTPS service URL, for example https://forex-ai-analyst.onrender.com.
      # Enables automatic Telegram command and inline-button webhook setup.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: AUTO_EXECUTE_TRADES
        # BingX VST/demo orders require this plus BINGX_API_KEY and BINGX_SECRET.
        value: "false"
      - key: KILL_SWITCH
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AI_TRADER_MODEL
        value: "gpt-4o-mini"
      - key: BINGX_API_KEY
        sync: false
      - key: BINGX_SECRET
        sync: false
      # Public BingX perpetual OHLCV only. No BingX account or API key is needed.
      # This is the one multi-strategy Render service; VST execution remains optional.
      - key: MULTI_STRATEGY_PROVIDER
        value: "bingx"
      - key: MULTI_STRATEGY_PAIRS
        value: "BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,BNB-USDT"
      - key: MULTI_STRATEGY_SCAN_INTERVAL_SECONDS
        value: "300"
      - key: VST_OPEN_SLA_MINUTES
        value: "120"